name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --doc
      - run: cargo test --locked --release
      - run: cargo rustdoc --locked --lib -- -D warnings -D missing-docs
      - run: cargo run --locked --example tour

      - name: Seeded stress
        env:
          WEAVE_STRESS_SEED: 20261003
          WEAVE_STRESS_ROUNDS: 200
        run: cargo test --locked --release --test safety_stress
      - name: Verify feature-test traceability
        shell: pwsh
        run: ./docs/verification/verify.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: traceability-${{ matrix.os }}
          path: target/verification/traceability.json

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-02
          components: miri
      - run: cargo miri setup
      - name: Scoped lifetimes and compatible units
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-seed=20261003
        run: cargo miri test --locked --lib --test miri_core
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify equivalent checksums without regression thresholds
        env:
          WEAVE_BENCH_SAMPLES: 1
        run: cargo run --locked --release --manifest-path benchmarks/Cargo.toml -- time 2